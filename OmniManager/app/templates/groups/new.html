{% extends "base.html" %}
{% block title %}New Group{% endblock %}

{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{{ url_for('dashboard.index') }}">Home</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('groups.index') }}">Groups</a></li>
<li class="breadcrumb-item active">New Group</li>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header"><h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>New Endpoint Group</h5></div>
      <div class="card-body">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" required placeholder="e.g. Servers, Workstations">
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="2" placeholder="Optional description"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Color</label>
            <div class="d-flex gap-2 align-items-center">
              <input type="color" name="color" class="form-control form-control-color" value="#6366f1" style="width:48px;height:38px">
              <small class="text-muted">Used for visual identification</small>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Create Group</button>
            <a href="{{ url_for('groups.index') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
