{% extends "base.html" %}
{% block title %}Set New Password{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center omni-login-bg">
  <div class="card omni-login-card shadow-lg">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <i class="bi bi-shield-lock-fill text-primary fs-1"></i>
        <h2 class="mt-2 fw-bold">Set New Password</h2>
        <p class="text-muted small">Choose a strong password for your account.</p>
      </div>

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="password">New Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password"
                   required minlength="8" autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password2">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="form-control" id="password2" name="password2"
                   required minlength="8">
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-check-circle me-1"></i>Update Password
        </button>
      </form>

      <div class="text-center mt-3">
        <a href="{{ url_for('auth.login') }}" class="text-muted small">
          <i class="bi bi-arrow-left me-1"></i>Back to login
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
