{% extends "base.html" %}
{% block title %}Forgot Password{% endblock unauth_content %}

{% block unauth_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center omni-login-bg">
  <div class="card omni-login-card shadow-lg">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <i class="bi bi-lock-fill text-primary fs-1"></i>
        <h2 class="mt-2 fw-bold">Reset Password</h2>
        <p class="text-muted small">Enter your email to receive a reset link.</p>
      </div>

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-4">
          <label class="form-label" for="email">Email address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" name="email" required autofocus>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-send me-1"></i>Send Reset Link
        </button>
      </form>

      <div class="text-center mt-3">
        <a href="{{ url_for('auth.login') }}" class="text-muted small">
          <i class="bi bi-arrow-left me-1"></i>Back to login
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock unauth_content %}
