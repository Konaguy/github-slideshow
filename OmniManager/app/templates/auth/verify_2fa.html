{% extends "base.html" %}
{% block title %}Two-Factor Authentication{% endblock %}

{% block unauth_content %}
<div class="omni-login-bg d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="omni-login-card p-4 p-md-5">
    <div class="text-center mb-4">
      <i class="bi bi-shield-lock-fill text-primary" style="font-size:3rem"></i>
      <h1 class="h4 mt-2 mb-1">Two-Factor Authentication</h1>
      <p class="text-muted small">Enter the code from your authenticator app</p>
    </div>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-4">
        <input type="text" name="token" class="form-control form-control-lg text-center"
               placeholder="000 000" maxlength="6" inputmode="numeric"
               pattern="[0-9]{6}" autocomplete="one-time-code" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-unlock me-1"></i>Verify
      </button>
    </form>
    <div class="text-center mt-3">
      <a href="{{ url_for('auth.login') }}" class="small text-muted">Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
