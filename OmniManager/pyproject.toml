[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "omnimanager"
version = "1.0.0"
description = "Windows endpoint management: patches, software, vulnerabilities, RDP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "OmniManager" }
]
keywords = ["windows", "endpoint", "patch", "management", "winrm", "rdp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Flask",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "Flask>=3.0",
  "Flask-SQLAlchemy>=3.1",
  "Flask-Login>=0.6",
  "Flask-SocketIO>=5.3",
  "Flask-WTF>=1.2",
  "Werkzeug>=3.0",
  "SQLAlchemy>=2.0",
  "pywinrm>=0.4",
  "python-dotenv>=1.0",
  "eventlet>=0.36",
  "requests>=2.32",
]

[project.scripts]
omnimanager = "run:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["templates/**/*", "static/**/*"]
